<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #232633;
      --border: #2a2d3a;
      --text: #e8e8ed;
      --text-muted: #6b6e7b;
      --accent: #6c5ce7;
      --accent-hover: #7c6ef7;
      --danger: #e74c5c;
      --danger-hover: #f75c6c;
      --done-text: #4a4d5a;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent) 0%, #a29bfe 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .input-row input::placeholder {
      color: var(--text-muted);
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .btn-add:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      transition: background 0.15s, border-color 0.15s;
    }

    .list-item:hover {
      background: var(--surface-hover);
    }

    .list-item input[type="checkbox"] {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .list-item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .list-item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 6px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .list-item input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .item-text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
      transition: color 0.2s;
    }

    .list-item.done .item-text {
      text-decoration: line-through;
      color: var(--done-text);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(231, 76, 92, 0.1);
    }

    .btn-delete:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-delete svg {
      width: 18px;
      height: 18px;
    }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 48px 0;
      font-size: 0.95rem;
    }

    @media (max-width: 480px) {
      body { padding: 24px 12px; }
      .header h1 { font-size: 1.5rem; }
      .list-item { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Todo</h1>
      <p>In-memory only — data resets on refresh</p>
    </header>

    <form class="input-row" id="todo-form" autocomplete="off">
      <input type="text" id="todo-input" placeholder="Add a new task..." aria-label="New todo text" required>
      <button type="submit" class="btn-add" aria-label="Add todo">Add</button>
    </form>

    <ul class="list" id="todo-list" aria-label="Todo list"></ul>
    <p class="empty" id="empty-state">Nothing here yet.</p>
  </div>

  <script>
    (function () {
      const todos = [];
      let nextId = 1;

      const form = document.getElementById('todo-form');
      const input = document.getElementById('todo-input');
      const list = document.getElementById('todo-list');
      const emptyState = document.getElementById('empty-state');

      function render() {
        list.innerHTML = '';
        emptyState.style.display = todos.length === 0 ? 'block' : 'none';

        todos.forEach(function (item) {
          const li = document.createElement('li');
          li.className = 'list-item' + (item.done ? ' done' : '');
          li.setAttribute('data-id', item.id);

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = item.done;
          checkbox.setAttribute('aria-label', 'Mark "' + item.text + '" as ' + (item.done ? 'not done' : 'done'));
          checkbox.addEventListener('change', function () {
            toggleTodo(item.id);
          });

          const text = document.createElement('span');
          text.className = 'item-text';
          text.textContent = item.text;

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn-delete';
          deleteBtn.setAttribute('aria-label', 'Delete "' + item.text + '"');
          deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';
          deleteBtn.addEventListener('click', function () {
            deleteTodo(item.id);
          });

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(deleteBtn);
          list.appendChild(li);
        });
      }

      function addTodo(text) {
        todos.push({ id: nextId++, text: text, done: false });
        render();
      }

      function toggleTodo(id) {
        const item = todos.find(function (t) { return t.id === id; });
        if (item) {
          item.done = !item.done;
          render();
        }
      }

      function deleteTodo(id) {
        const idx = todos.findIndex(function (t) { return t.id === id; });
        if (idx !== -1) {
          todos.splice(idx, 1);
          render();
        }
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const text = input.value.trim();
        if (text) {
          addTodo(text);
          input.value = '';
          input.focus();
        }
      });

      render();
    })();
  </script>
</body>
</html>
